<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1c1a19; background: #fff7f2; }
  header { background: linear-gradient(120deg,#e8491d,#ffa41b); color: #fff; padding: 12px 14px; font-weight: 800; font-size: 16px; }
  main { padding: 12px 14px; display: grid; gap: 10px; }
  input { width: 100%; box-sizing: border-box; min-height: 40px; border: 1.5px solid #f1e3da; border-radius: 10px; padding: 0 10px; font: inherit; }
  button, a.btn { display: block; width: 100%; box-sizing: border-box; text-align: center; min-height: 40px; border: 0; border-radius: 999px; background: #d0390f; color: #fff; font-weight: 700; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; line-height: 40px; }
  a.link { color: #d0390f; font-size: 13px; }
  p { margin: 0; font-size: 13px; color: #5b6170; }
</style>
</head>
<body>
<header>Săn Deal</header>
<main>
  <p>Mở trang sản phẩm Shopee, Lazada hoặc TikTok Shop, bảng lịch sử giá sẽ hiện ở góc phải màn hình.</p>
  <form id="f"><input id="u" placeholder="Hoặc dán link sản phẩm…" aria-label="Link sản phẩm" required><button style="margin-top:8px">Kiểm tra giá</button></form>
  <a class="btn" id="home" target="_blank" style="background:#1c1a19">Mở trang Săn Deal</a>
  <a class="link" href="options.html" target="_blank">Tuỳ chọn máy chủ</a>
</main>
<script src="config.js"></script>
<script src="popup.js"></script>
</body>
</html>
